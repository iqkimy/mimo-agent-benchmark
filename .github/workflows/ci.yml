name: Benchmark CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'  # Nightly at 2 AM UTC

jobs:
  validate:
    name: Validate Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/validate.js
      - run: node --check harness/**/*.js scripts/**/*.js

  benchmark-smoke:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'
    env:
      MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/run.js --hypothesis h1 --hypothesis h2 --iterations 2 --verbose
        if: env.MIMO_API_KEY != ''
      - run: node scripts/run.js --hypothesis h1 --hypothesis h2 --iterations 2 --dry-run --verbose
        if: env.MIMO_API_KEY == ''

  benchmark-full:
    name: Full Benchmark
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'schedule' || github.event_name == 'push'
    env:
      MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/run.js --iterations 5 --verbose
        if: env.MIMO_API_KEY != ''
      - run: node scripts/run.js --iterations 5 --dry-run --verbose
        if: env.MIMO_API_KEY == ''
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: results/
          retention-days: 30

  compare-release:
    name: Release Comparison
    runs-on: ubuntu-latest
    needs: benchmark-full
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: benchmark-results
          path: results/
      - run: node scripts/compare.js results/latest workloads/reference/gpt4o-baseline.json
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: release-comparison
          path: results/latest/comparison*.json
